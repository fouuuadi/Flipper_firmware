; Firmware ESP32 des boutons physiques de la borne flipper HETIC.
; Lit les GPIO et publie les appuis sur MQTT (cf. contrat dans le README).
;
; Deux profils :
;   dev  → config injectée par variables d'environnement (broker distant/IP),
;          pour flasher depuis un poste de dev.
;   prod → config de déploiement Fliphetic en dur (valeurs NON secrètes) ; c'est
;          ce profil que la CI de Release compile et publie en `firmware.bin`.
;          La borne flashe ce binaire au Load, elle ne compile jamais.

[platformio]
default_envs = dev

; Options communes aux deux profils.
[env]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0

; --- Profil dev : tout injecté par l'environnement (comme le .env du back) -----
; Variables requises : WIFI_SSID, WIFI_PASSWORD, MQTT_BROKER_IP, MQTT_BROKER_PORT,
; DEVICE_ID. NB : `MQTT_BROKER_IP` (et non MQTT_BROKER_HOST) car côté back
; MQTT_BROKER_HOST vaut `mqtt` (service Docker) ; le firmware a besoin d'une IP.
[env:dev]
monitor_speed = 115200
build_flags =
    -DSERIAL_BAUD=115200
    '-DWIFI_SSID="${sysenv.WIFI_SSID}"'
    '-DWIFI_PASSWORD="${sysenv.WIFI_PASSWORD}"'
    '-DMQTT_BROKER_HOST="${sysenv.MQTT_BROKER_IP}"'
    -DMQTT_BROKER_PORT=${sysenv.MQTT_BROKER_PORT}
    '-DDEVICE_ID="${sysenv.DEVICE_ID}"'

; --- Profil prod : config de déploiement Fliphetic --------------------------
; Valeurs NON secrètes, en dur (ce repo est public).
; Pas de MQTT_BROKER_HOST : le firmware joint la passerelle WiFi, càd la borne
; elle-même (elle héberge l'AP FLIPHETIC_CAB0), cf. connectMqtt().
; WIFI_PASSWORD : injecté par la CI via PLATFORMIO_BUILD_FLAGS depuis le secret
; GitHub WIFI_PASS (jamais dans les sources). Fallback vide en local (cf.
; include/Config.h) → le build passe, mais le WiFi ne se connecte pas.
[env:prod]
monitor_speed = 921600
build_flags =
    -DSERIAL_BAUD=921600
    -DWIFI_SSID='"FLIPHETIC_CAB0"'
    -DMQTT_BROKER_PORT=1883
    -DDEVICE_ID='"esp32-test"'
